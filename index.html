    }

      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

    // Optional Firebase configuration setup (Ganti dengan config milik Anda jika ingin sync ke database sendiri)
    const firebaseConfig = {
      // apiKey: "YOUR_API_KEY",
      // authDomain: "YOUR_PROJECT.firebaseapp.com",
      // projectId: "YOUR_PROJECT_ID",
      // storageBucket: "YOUR_PROJECT.appspot.com",
      // messagingSenderId: "SENDER_ID",
      // appId: "APP_ID"
    };

    let app = null;
    let auth = null;
    let db = null;

    try {
      if (firebaseConfig && firebaseConfig.apiKey) {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      }
    } catch (e) {
      console.warn("Firebase fallback to Local Storage Mode", e);
    }

    const appId = 'ruang-pulang-circle';

    // SVG Icons Helper Component
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons();
        }

      return <i data-lucide={name} className={className} ref={iconRef}></i>;
    };

    const DEFAULT_MEMBERS = [

    const DEFAULT_ACTIVITIES = [

      { id: '2', name: 'Yogyakarta', visits: '2 Kali', photo: 'https://images.unsplash.com/photo-1596402184320-417e7178b2cd?auto=format&fit=crop&q=80&w=800', description: 'Jalan Malioboro, gudeg malam hari, dan naik delman di alun-alun.' }
    ];

    const DEFAULT_JOURNALS = [
      { id: '1', title: 'Tentang Bertumbuh Tanpa Harus Berjauhan', author: 'Alrisa', date: '10 Januari 2025', photo: 'https://images.unsplash.com/photo-1499209974431-9dac3ada00d7?auto=format&fit=crop&q=80&w=800', content: 'Kadang aku berpikir tentang masa depan kita masing-masing. Pekerjaan baru, kota yang berbeda, atau kesibukan yang menyita waktu. Tapi setiap kali kita berkumpul lagi di ruang ini, waktu seolah berhenti. Kita tetaplah anak-anak muda yang tertawa di kedai kopi dua tahun lalu.' }

    const DEFAULT_LETTERS = [
      { id: '1', sender: 'Fasya', recipient: 'Semua Circle', category: 'Open when you miss us', content: 'Hey guys! Kalau kamu lagi ngerasa sendiri atau capek sama rutinitas, inget ya kalau kami selalu ada satu telfon jauhnya. Jangan dipendem sendiri!', date: '01 Feb 2025' },
      { id: '2', sender: 'Anonim', recipient: 'Semua Circle', category: 'Open on your birthday', content: 'Makasih udah jadi tempat aman buat saling cerita tanpa takut di-judge. Love you all so much!', date: '14 Feb 2025' }
    ];

    const DEFAULT_WALL_OF_CHAOS = [
      { id: '1', title: 'Alasan Telat Paling Absurd', author: 'Fasya', quote: '“Gue udah di jalan (padahal baru bangun dan masih pakai selimut)”', photo: 'https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&q=80&w=600', tag: 'Inside Joke' },
      { id: '2', title: 'Ayam Geprek Level 100', author: 'Khansa', quote: '“Siapa bilang ini pedas? *mata berkaca-kaca*”', photo: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&q=80&w=600', tag: 'Fail Moment' }

    const DEFAULT_SOUNDTRACK = [
      { id: '1', title: 'Rayuan Perempuan Gila', artist: 'Nadin Amizah', addedBy: 'Fasya', story: 'Lagu wajib pas kami road trip malam-malam hujan.', link: 'https://open.spotify.com' },
      { id: '2', title: 'Evaluasi', artist: 'Hindia', addedBy: 'Alrisa', story: 'Diputar berulang kali waktu kita lagi pusing tugas akhir.', link: 'https://open.spotify.com' }

    const DEFAULT_AWARDS = [
      { id: '1', title: '🏆 Most Likely To Be Late', winner: 'Al Fasya', description: 'Rekor telat 47 menit dengan alasan kucing tetangga melahirkan.', nominatedBy: 'Khansa' },
      { id: '2', title: '🏆 Mom of The Group', winner: 'Alrisa', description: 'Selalu bawa tisu basah, minyak kayu putih, dan obat maag.', nominatedBy: 'Amalia' }

      { id: '1', title: 'Surat Rahasia Tahun Baru 2027', openDate: '2027-01-01', content: 'Selamat! Kita berhasil melewati tahun-tahun sulit. Janji ya untuk tetap rutin ketemu minimal sebulan sekali!', author: 'Fasya', photo: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&q=80&w=800' }
    ];

      { id: '1', title: 'Nonton Konser Musik Festival Bersama', completed: true, dateCompleted: '14 Nov 2024', addedBy: 'Khansa' },
      { id: '2', title: 'Road trip Bali - Lombok 7 Hari', completed: false, addedBy: 'Fasya' },
      { id: '3', title: 'Staycation Vila Kolam Renang Heated', completed: false, addedBy: 'Alrisa' }
    ];

    const DEFAULT_DREAM_BOARD = [
      { id: '1', author: 'Amalia', text: 'Pas umur 30 nanti, kita masih punya waktu liburan bareng seminggu full tiap tahun!', tag: 'Masa Depan' },
      { id: '2', author: 'Fasya', text: 'Semoga kita semua sukses dengan karir masing-masing tapi tetep sama konyolnya pas ketemu.', tag: 'Doa Bersama' }
    ];

    const DEFAULT_GUESTBOOK = [
      { id: '1', name: 'Rian (Teman Kampus)', message: 'Suka banget sama visual scrapbook kalian! Salam hangat yaa ✨', emoji: '💖', date: '28 Feb 2026' },
      { id: '2', name: 'Sarah', message: 'Kalian konyol banget di Wall of Chaos, langgeng terus persahabatannya!', emoji: '🌸', date: '01 Mar 2026' }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('beranda');
      const [subTab, setSubTab] = useState('places');
      const [userName, setUserName] = useState(localStorage.getItem('rp_user_name') || '');
      const [showNameModal, setShowNameModal] = useState(false);
      const [pendingAction, setPendingAction] = useState(null);

      // Publishing & Public Preview
      const [isPublicView, setIsPublicView] = useState(false);
      const [showPublishModal, setShowPublishModal] = useState(false);
      const [publishTab, setPublishTab] = useState('link');
      const [copySuccess, setCopySuccess] = useState(false);

      // State Data
      const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('rp_settings')) || DEFAULT_SETTINGS);
      const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('rp_members')) || DEFAULT_MEMBERS);
      const [stories, setStories] = useState(() => JSON.parse(localStorage.getItem('rp_stories')) || DEFAULT_STORIES);
      const [memories, setMemories] = useState(() => JSON.parse(localStorage.getItem('rp_memories')) || DEFAULT_MEMORIES);
      const [activities, setActivities] = useState(() => JSON.parse(localStorage.getItem('rp_activities')) || DEFAULT_ACTIVITIES);
      const [places, setPlaces] = useState(() => JSON.parse(localStorage.getItem('rp_places')) || DEFAULT_PLACES);
      const [journals, setJournals] = useState(() => JSON.parse(localStorage.getItem('rp_journals')) || DEFAULT_JOURNALS);
      const [letters, setLetters] = useState(() => JSON.parse(localStorage.getItem('rp_letters')) || DEFAULT_LETTERS);
      const [wallOfChaos, setWallOfChaos] = useState(() => JSON.parse(localStorage.getItem('rp_wallOfChaos')) || DEFAULT_WALL_OF_CHAOS);
      const [soundtrack, setSoundtrack] = useState(() => JSON.parse(localStorage.getItem('rp_soundtrack')) || DEFAULT_SOUNDTRACK);
      const [awards, setAwards] = useState(() => JSON.parse(localStorage.getItem('rp_awards')) || DEFAULT_AWARDS);
      const [vault, setVault] = useState(() => JSON.parse(localStorage.getItem('rp_vault')) || DEFAULT_VAULT);
      const [bucketList, setBucketList] = useState(() => JSON.parse(localStorage.getItem('rp_bucketList')) || DEFAULT_BUCKET_LIST);
      const [dreamBoard, setDreamBoard] = useState(() => JSON.parse(localStorage.getItem('rp_dreamBoard')) || DEFAULT_DREAM_BOARD);
      const [guestbook, setGuestbook] = useState(() => JSON.parse(localStorage.getItem('rp_guestbook')) || DEFAULT_GUESTBOOK);

      const [newGuestMessage, setNewGuestMessage] = useState('');
      const [newGuestName, setNewGuestName] = useState('');
      const [newGuestEmoji, setNewGuestEmoji] = useState('💖');
      const [selectedCategory, setSelectedCategory] = useState('All');

      // Status indicator
      const [syncStatus, setSyncStatus] = useState('Auto Sync Ready');

      // Envelope Letter Modal
      const [activeLetter, setActiveLetter] = useState(null);
      const [isLetterOpen, setIsLetterOpen] = useState(false);

      // Save to localStorage helper
      useEffect(() => {
        localStorage.setItem('rp_settings', JSON.stringify(settings));
        localStorage.setItem('rp_members', JSON.stringify(members));
        localStorage.setItem('rp_stories', JSON.stringify(stories));
        localStorage.setItem('rp_memories', JSON.stringify(memories));
        localStorage.setItem('rp_activities', JSON.stringify(activities));
        localStorage.setItem('rp_places', JSON.stringify(places));
        localStorage.setItem('rp_journals', JSON.stringify(journals));
        localStorage.setItem('rp_letters', JSON.stringify(letters));
        localStorage.setItem('rp_wallOfChaos', JSON.stringify(wallOfChaos));
        localStorage.setItem('rp_soundtrack', JSON.stringify(soundtrack));
        localStorage.setItem('rp_awards', JSON.stringify(awards));
        localStorage.setItem('rp_vault', JSON.stringify(vault));
        localStorage.setItem('rp_bucketList', JSON.stringify(bucketList));
        localStorage.setItem('rp_dreamBoard', JSON.stringify(dreamBoard));
        localStorage.setItem('rp_guestbook', JSON.stringify(guestbook));
      }, [settings, members, stories, memories, activities, places, journals, letters, wallOfChaos, soundtrack, awards, vault, bucketList, dreamBoard, guestbook]);

      // Firebase Auth & Firestore Real-Time Subscriptions if Firebase Configured
      useEffect(() => {
        if (!auth || !db) {
          setSyncStatus('Local Storage Sync (Siap Deploy)');
          return;
        }

        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (err) {
            console.warn("Auth info:", err);
          }
        };
        initAuth();

        const unsubAuth = onAuthStateChanged(auth, (u) => setUser(u));

        const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);

        const unsubSettings = onSnapshot(getColRef('settings'), (snap) => {
          if (!snap.empty) setSettings(snap.docs[0].data());
        });

        const syncCol = (colName, setter) => {
          return onSnapshot(getColRef(colName), (snap) => {
            if (!snap.empty) {
              const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              setter(items);
            }
          });
        };

        const unsubs = [
          unsubSettings,
          syncCol('members', setMembers),
          syncCol('stories', setStories),
          syncCol('memories', setMemories),
          syncCol('activities', setActivities),
          syncCol('places', setPlaces),
          syncCol('journals', setJournals),
          syncCol('letters', setLetters),
          syncCol('wall_of_chaos', setWallOfChaos),
          syncCol('soundtrack', setSoundtrack),
          syncCol('awards', setAwards),
          syncCol('vault', setVault),
          syncCol('bucket_list', setBucketList),
          syncCol('dream_board', setDreamBoard),
          syncCol('guestbook', setGuestbook),
        ];

        setSyncStatus('Firebase Live Sync Active ⚡');

        return () => {
          unsubAuth();
          unsubs.forEach(u => u && u());
        };
      }, []);

      // Copy Shareable URL
      const handleCopyLink = () => {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 2500);
        });
      };

      // Export Backup JSON
      const handleExportJSON = () => {
        const data = {
          settings, members, stories, memories, activities, places,
          journals, letters, wallOfChaos, soundtrack, awards, vault,
          bucketList, dreamBoard, guestbook, exportedAt: new Date().toISOString()
        };
        const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const a = document.createElement('a');
        a.href = str;
        a.download = `${settings.circleName.toLowerCase().replace(/\s+/g, '_')}_scrapbook.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      // Add Guestbook Message
      const handleAddGuestbookMessage = (e) => {
        e.preventDefault();
        if (!newGuestName.trim() || !newGuestMessage.trim()) return;

        const newEntry = {
          id: Date.now().toString(),
          name: newGuestName,
          message: newGuestMessage,
          emoji: newGuestEmoji,
          date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
        };

        setGuestbook(prev => [newEntry, ...prev]);

        if (db && user) {
          try {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'guestbook');
            addDoc(colRef, { ...newEntry, createdAt: serverTimestamp() });
          } catch(err) { console.error(err); }
        }

        setNewGuestName('');
        setNewGuestMessage('');
      };

      // Toggle Bucket List Status
      const toggleBucketList = (id) => {
        setBucketList(prev => prev.map(item => {
          if (item.id === id) {
            return {
              ...item,
              completed: !item.completed,
              dateCompleted: !item.completed ? new Date().toLocaleDateString('id-ID') : ''
            };
          }
          return item;
        }));
      };

      // Filtered Memories
      const filteredMemories = selectedCategory === 'All' 
        ? memories 
        : memories.filter(m => m.category === selectedCategory);

      return (
        <div className="min-h-screen bg-[#FFF9F2] text-[#26354A]">
          
          {/* Guest Mode Indicator */}
          {isPublicView && (
            <div className="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white text-xs font-semibold py-1.5 px-4 text-center flex items-center justify-center gap-2 shadow-sm">
              <span>👁️ Mode Tamu Aktif (Public Preview Mode)</span>
              <button
                onClick={() => setIsPublicView(false)}
                className="underline bg-white/20 hover:bg-white/30 px-2.5 py-0.5 rounded text-[11px] font-bold transition"
              >
                Kembali ke Mode Pengedit
              </button>
            </div>
          )}

          {/* Top Navigation Bar */}
          <header className="sticky top-0 z-40 bg-[#FFF9F2]/90 backdrop-blur-md border-b border-[#E8E0F5] px-4 py-3 shadow-sm print:hidden">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              {/* Brand Logo */}
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('beranda')}>
                <div className="w-10 h-10 rounded-2xl bg-[#F9DDE8] flex items-center justify-center text-[#26354A] shadow-inner font-bold text-xl">
                  🏠
                </div>
                <div>
                  <h1 className="font-serif font-bold text-xl leading-none text-[#26354A]">

                    <div className="space-y-4">
                      {vault.map(v => (
                        <div key={v.id} className="bg-white p-6 rounded-3xl border shadow-sm space-y-3">
                          <span className="text-xs font-bold bg-purple-100 text-purple-800 px-3 py-1 rounded-full">
                            Buka Tanggal: {v.openDate}
                          </span>
                          <h4 className="font-serif font-bold text-lg text-gray-800 mt-2">{v.title}</h4>
                          <p className="text-xs text-gray-600">{v.content}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Bucket List */}
                {subTab === 'bucketList' && (
                  <div className="space-y-6">
                    <h3 className="font-serif font-bold text-2xl text-gray-800">Circle Bucket List ✅</h3>
                    <div className="space-y-3">
                      {bucketList.map(item => (
                        <div
                          key={item.id}
                          onClick={() => toggleBucketList(item.id)}
                          className={`p-4 rounded-2xl border flex items-center justify-between cursor-pointer transition ${
                            item.completed ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-white border-gray-200'
                          }`}
                        >
                          <div className="flex items-center space-x-3">
                            <input type="checkbox" checked={item.completed} readOnly className="w-4 h-4 rounded text-pink-500" />
                            <span className={`text-xs font-semibold ${item.completed ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                              {item.title}
                            </span>
                          </div>
                          {item.completed && <span className="text-[10px] bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full font-bold">Selesai {item.dateCompleted}</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Dream Board */}
                {subTab === 'dreamBoard' && (
                  <div className="space-y-6">
                    <h3 className="font-serif font-bold text-2xl text-gray-800">Dream Board & Doa ✨</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {dreamBoard.map(d => (
                        <div key={d.id} className="bg-gradient-to-tr from-pink-50 to-purple-50 p-5 rounded-3xl border border-pink-100 space-y-2">
                          <span className="text-[10px] bg-pink-200 text-pink-800 px-2.5 py-0.5 rounded-full font-bold">{d.tag}</span>
                          <p className="text-xs text-gray-700 italic font-serif">"{d.text}"</p>
                          <span className="text-[10px] text-gray-400 block text-right">— {d.author}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* PUBLISH & SHARE MODAL */}
          {showPublishModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-2xl w-full space-y-6 shadow-2xl border border-purple-100 animate-scaleUp my-8">
                
                <div className="flex justify-between items-center border-b pb-4">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-400 to-purple-500 text-white flex items-center justify-center font-bold text-xl shadow">
                      🚀
                    </div>
                    <div>
                      <h3 className="font-serif font-bold text-2xl text-gray-800">Pusat Publikasi & Bagikan</h3>
                      <p className="text-xs text-gray-500">Publikasikan web scrapbook ini ke teman-teman Anda!</p>
                    </div>
                  </div>
                  <button onClick={() => setShowPublishModal(false)} className="text-gray-400 hover:text-gray-600 font-bold text-lg">
                    ✕
                  </button>
                </div>

                <div className="flex space-x-2 border-b pb-2 overflow-x-auto text-xs font-semibold">
                  {[
                    { id: 'link', label: '🔗 Tautan & QR Code' },
                    { id: 'settings', label: '⚙️ Preview Mode Tamu' },
                    { id: 'export', label: '🖨️ Ekspor & Backup' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setPublishTab(tab.id)}
                      className={`px-4 py-2 rounded-xl transition ${
                        publishTab === tab.id ? 'bg-[#F9DDE8] text-pink-900 font-bold' : 'hover:bg-gray-100 text-gray-600'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {publishTab === 'link' && (
                  <div className="space-y-6 animate-fadeIn">
                    <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-xs text-emerald-900 flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-emerald-200 flex items-center justify-center text-emerald-800 font-bold text-base">
                        ✓
                      </div>
                      <div>
                        <p className="font-bold text-sm">Status Web: Aktif & Dipublikasikan 🌐</p>
                        <p className="text-emerald-700">Tautan ini siap dibagikan dan dibuka dari perangkat mana saja.</p>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <label className="block text-xs font-bold text-gray-700">Tautan Web Scrapbook:</label>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          readOnly
                          value={window.location.href}
                          className="flex-1 bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-mono text-gray-700 focus:outline-none"
                        />
                        <button
                          onClick={handleCopyLink}
                          className="px-4 py-2 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl text-xs shadow-sm transition"
                        >
                          {copySuccess ? 'Tersalin! ✓' : 'Salin Link'}
                        </button>
                      </div>
                    </div>

                    <div className="bg-[#FFF9F2] p-5 rounded-2xl border border-amber-100 flex flex-col md:flex-row items-center gap-6">
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(window.location.href)}`}
                        alt="QR Code Scrapbook"
                        className="w-36 h-36 border-4 border-white rounded-2xl shadow-md bg-white p-2"
                      />
                      <div className="space-y-2 text-center md:text-left">
                        <h4 className="font-serif font-bold text-base text-gray-800">Scan QR Code</h4>
                        <p className="text-xs text-gray-600 leading-relaxed">
                          Pindai QR code ini menggunakan kamera HP untuk langsung membuka web scrapbook ini.
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {publishTab === 'settings' && (
                  <div className="space-y-5 animate-fadeIn">
                    <div className="p-4 rounded-2xl bg-purple-50 border border-purple-100 flex justify-between items-center">
                      <div>
                        <h4 className="font-bold text-sm text-gray-800">Mode Tamu (Public View)</h4>
                        <p className="text-xs text-gray-500">Sembunyikan tombol pengeditan saat menunjukkan ke pengunjung.</p>
                      </div>
                      <button
                        onClick={() => {
                          setIsPublicView(!isPublicView);
                          setShowPublishModal(false);
                        }}
                        className="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold"
                      >
                        {isPublicView ? 'Matikan Mode Tamu' : 'Aktifkan Mode Tamu'}
                      </button>
                    </div>
                  </div>
                )}

                {publishTab === 'export' && (
                  <div className="space-y-6 animate-fadeIn">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="bg-[#FFF9F2] p-5 rounded-2xl border border-amber-200 space-y-3">
                        <h4 className="font-serif font-bold text-lg text-gray-800">Cetak / Save PDF 🖨️</h4>
                        <p className="text-xs text-gray-600">Cetak fisik atau simpan halaman sebagai PDF.</p>
                        <button
                          onClick={() => window.print()}
                          className="w-full py-2 bg-amber-500 text-white font-bold rounded-xl text-xs"
                        >
                          Cetak PDF
                        </button>
                      </div>

                      <div className="bg-[#E8E0F5]/50 p-5 rounded-2xl border border-purple-200 space-y-3">
                        <h4 className="font-serif font-bold text-lg text-gray-800">Backup Data JSON 💾</h4>
                        <p className="text-xs text-gray-600">Unduh seluruh data scrapbook sebagai file cadangan.</p>
                        <button
                          onClick={handleExportJSON}
                          className="w-full py-2 bg-purple-600 text-white font-bold rounded-xl text-xs"
                        >
                          Unduh JSON
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="pt-4 border-t flex justify-end">
                  <button
                    onClick={() => setShowPublishModal(false)}
                    className="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs"
                  >
                    Tutup
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* LETTER READ MODAL */}
          {isLetterOpen && activeLetter && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full space-y-4 shadow-2xl animate-scaleUp border-2 border-pink-200 text-center">
                <span className="text-xs font-bold bg-pink-100 text-pink-800 px-3 py-1 rounded-full">
                  {activeLetter.category}
                </span>
                <h3 className="font-serif font-bold text-2xl text-gray-800">Untuk: {activeLetter.recipient}</h3>
                <div className="bg-[#FFF9F2] p-6 rounded-2xl border border-amber-100 text-xs text-gray-700 italic leading-relaxed text-left font-serif">
                  "{activeLetter.content}"
                </div>
                <div className="flex justify-between items-center text-xs text-gray-400 pt-2">
                  <span>Dari: {activeLetter.sender}</span>
                  <span>🗓️ {activeLetter.date}</span>
                </div>
                <button
                  onClick={() => setIsLetterOpen(false)}
                  className="w-full py-2.5 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl text-xs transition"
                >
                  Tutup Surat
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-[#E8E0F5] bg-white/50 mt-16 py-8 text-center text-xs text-gray-500 print:hidden">
            <div className="max-w-7xl mx-auto space-y-2">
              <p className="font-serif font-bold text-gray-700 text-sm">{settings.circleName} Digital Scrapbook</p>
              <p>"{settings.customQuote}"</p>
              <p className="text-[10px] text-gray-400">Dipublikasikan secara publik • Siap dideploy ke GitHub Pages & Vercel</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
